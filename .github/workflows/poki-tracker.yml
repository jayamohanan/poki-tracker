name: Poki Tracker

on:
  workflow_dispatch:
    inputs:
      period:
        description: "auto = scrape only if due today (Sunday / month-end). Others scrape now."
        type: choice
        default: auto
        options:
          - auto
          - weekly
          - monthly
          - both

  schedule:
    # GitHub cron is UTC. 15:30 UTC = 21:00 IST, leaving buffer before
    # midnight IST for delayed runs (the script uses IST dates).
    - cron: "30 15 * * *"

permissions:
  contents: write

concurrency:
  group: poki-tracker
  cancel-in-progress: false

jobs:
  poki-tracker:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Kolkata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decide what is due
        id: schedule
        run: |
          requested="${{ github.event.inputs.period || 'auto' }}"

          if [ "$requested" = "auto" ]; then
            python scripts/schedule_check.py
          else
            echo "Manual request: $requested"
            echo "period=$requested" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Poki tracker
        if: steps.schedule.outputs.period != 'none'
        run: |
          args=(--period "${{ steps.schedule.outputs.period }}")

          if [ -n "${{ steps.schedule.outputs.weekly_date }}" ]; then
            args+=(--weekly-date "${{ steps.schedule.outputs.weekly_date }}")
          fi

          if [ -n "${{ steps.schedule.outputs.monthly_date }}" ]; then
            args+=(--monthly-date "${{ steps.schedule.outputs.monthly_date }}")
          fi

          python scripts/poki_tracker.py "${args[@]}"

      - name: Commit generated data
        run: |
          git add data/

          if git diff --cached --quiet; then
            echo "No Poki data generated today."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Poki tracking data $(date +'%Y-%m-%d')"
          git push